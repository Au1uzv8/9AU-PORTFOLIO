<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0F">
<title>NEON LEDGER</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<style>
:root{--bg:#0A0A0F;--card:#14141C;--line:#23233150;--gold:#FFD700;--cyan:#00F0FF;--mag:#FF00E5;--lime:#CCFF00;--green:#39FF14;--red:#FF2D55;--dim:#7A7A93}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#E8E8F5;font-family:Rajdhani,system-ui,sans-serif}
h1,h2,h3,.num{font-family:Orbitron,sans-serif;letter-spacing:.5px}
.glow-g{color:var(--green);text-shadow:0 0 8px #39FF1480,0 0 18px #39FF1440}
.glow-r{color:var(--red);text-shadow:0 0 8px #FF2D5580,0 0 18px #FF2D5540}
.gold{color:var(--gold);text-shadow:0 0 10px #FFD70055}
.cyan{color:var(--cyan);text-shadow:0 0 10px #00F0FF55}
.mag{color:var(--mag);text-shadow:0 0 10px #FF00E555}
.lime{color:var(--lime);text-shadow:0 0 10px #CCFF0055}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0A0A0FEE;backdrop-filter:blur(10px);border-bottom:1px solid #FFD70022}
#appIcon{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;box-shadow:0 0 0 2px #00F0FF,0 0 14px #00F0FF80}
header h1{font-size:15px;margin:0}
#fxLine{font-size:12.5px;color:var(--cyan);font-weight:600}
.hbtn{margin-left:auto;display:flex;gap:8px}
button{font-family:Rajdhani,sans-serif;font-weight:700;cursor:pointer;border:none}
.chip{background:#1B1B26;color:var(--cyan);border:1px solid #00F0FF55;border-radius:999px;padding:8px 14px;font-size:13px}
.chip.on{background:#00F0FF1A;color:var(--gold);border-color:var(--gold);box-shadow:0 0 12px #FFD70045}
.chip.sm{padding:6px 11px;font-size:12px}
nav{display:flex;gap:8px;align-items:center;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
#rangeLbl{margin-left:auto;font-size:13px;color:var(--mag);white-space:nowrap;font-weight:700}
main{display:grid;gap:14px;padding:14px;max-width:1340px;margin:0 auto;grid-template-columns:1fr;padding-bottom:110px}
@media(min-width:900px){main{grid-template-columns:repeat(3,1fr)}.cards{grid-column:1/-1}.c-pie{grid-column:1/2}.c-radar{grid-column:2/3}.c-list{grid-column:3/4}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 0 0 1px #00F0FF10,0 8px 30px #00000070}
.card h3{margin:0 0 10px;font-size:13px;color:var(--gold);text-shadow:0 0 10px #FFD70044}
.cards{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.cards{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}
.kpi .lab{font-size:11.5px;color:var(--dim);font-weight:700;letter-spacing:1px}
.kpi .val{font-family:Orbitron;font-size:21px;margin-top:6px;word-break:break-all}
.kpi.i{border-color:#CCFF0045}.kpi.e{border-color:#FF00E545}.kpi.n{border-color:#FFD70045}.kpi.f{border-color:#00F0FF45}
.wrap-ch{position:relative;height:270px}
.row{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px dashed #2A2A3A;cursor:pointer;border-radius:10px}
.row:active{background:#00F0FF0E}
.row .th{width:38px;height:38px;border-radius:9px;object-fit:cover;background:#22222E;flex:0 0 auto}
.row .t1{font-size:14px;font-weight:700;color:#EDEDFA}
.row .t2{font-size:11.5px;color:var(--dim)}
.row .amt{margin-left:auto;font-family:Orbitron;font-size:14px;white-space:nowrap}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:26px 6px;line-height:1.7}
.crumb{font-size:12px;color:var(--cyan);margin-bottom:8px;min-height:16px}
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:45;background:linear-gradient(135deg,#FF00E5,#00F0FF);color:#06060A;font-size:16px;padding:16px 30px;border-radius:999px;box-shadow:0 0 26px #FF00E580,0 0 46px #00F0FF50;font-family:Orbitron;font-weight:800}
.ov{position:fixed;inset:0;background:#000000D0;backdrop-filter:blur(6px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:#11111A;border:1px solid #00F0FF40;border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:16px 16px 28px}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:15px;margin:2px 0 14px}
.sec{margin:14px 0 6px;font-size:11.5px;color:var(--dim);letter-spacing:1.4px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.amtbox{font-family:Orbitron;font-size:34px;text-align:center;padding:12px;border-radius:14px;background:#0B0B12;border:1px solid #FFD70045;margin:8px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:#1A1A24;color:var(--gold);border:1px solid #FFD70030;border-radius:12px;padding:15px 0;font-size:19px;font-family:Orbitron}
.big{width:100%;padding:15px;border-radius:14px;font-size:15px;font-family:Orbitron;margin-top:12px}
.ok{background:linear-gradient(135deg,#39FF14,#CCFF00);color:#06100A}
.no{background:#1A1A24;color:var(--red);border:1px solid #FF2D5545}
.prog{height:6px;background:#1A1A24;border-radius:99px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00F0FF,#FF00E5)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--cyan);text-align:left;font-size:11px;letter-spacing:1px;padding:7px 4px;border-bottom:1px solid #00F0FF30}
td{padding:7px 4px;border-bottom:1px dashed #2A2A3A}
td.r,th.r{text-align:right}
.shot{width:100%;border-radius:12px;border:1px solid #00F0FF35;margin-bottom:10px}
.hint{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<header>
  <img id="appIcon" alt="icon">
  <div><h1 class="gold">NEON LEDGER</h1><div id="fxLine">FX loading</div></div>
  <div class="hbtn"><button class="chip" id="btnCur">THB</button><button class="chip" id="btnSet">SET</button></div>
</header>
<nav>
  <button class="chip sm" data-p="day">DAY</button>
  <button class="chip sm" data-p="week">WEEK</button>
  <button class="chip sm on" data-p="month">MONTH</button>
  <button class="chip sm" data-p="year">YEAR</button>
  <button class="chip sm" id="prev">PREV</button>
  <button class="chip sm" id="next">NEXT</button>
  <span id="rangeLbl"></span>
</nav>
<main>
  <section class="cards">
    <div class="kpi i"><div class="lab">RECEIVE / INCOME</div><div class="val lime" id="kIn">-</div></div>
    <div class="kpi e"><div class="lab">PAY / EXPENSE</div><div class="val mag" id="kEx">-</div></div>
    <div class="kpi n"><div class="lab">NET BALANCE</div><div class="val" id="kNet">-</div></div>
    <div class="kpi f"><div class="lab">DAILY FX RATE</div><div class="val cyan" id="kFx">-</div></div>
  </section>
  <section class="card c-pie">
    <h3>EXPENSE SHARE - TAP TO DRILL DOWN</h3>
    <div class="crumb" id="crumb">LAYER 1</div>
    <div class="wrap-ch"><canvas id="pie"></canvas></div>
  </section>
  <section class="card c-radar">
    <h3>GROUP COMPARE - THIS VS PREVIOUS</h3>
    <div class="crumb" id="radarNote"></div>
    <div class="wrap-ch"><canvas id="radar"></canvas></div>
  </section>
  <section class="card c-list">
    <h3>RECENT - TAP TO VIEW RECEIPT</h3>
    <div id="list"></div>
  </section>
</main>
<button id="fab">UPLOAD</button>
<input type="file" id="fileIn" accept="image/*" multiple hidden>
<input type="file" id="jsonIn" accept="application/json,.json" hidden>
<input type="file" id="iconIn" accept="image/*" hidden>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
var KEY='neon_ledger_v1';
var DEF={v:1,items:[],map:{},fx:{rate:36.5,date:null,live:false},icon:null,disp:'THB'};
var DB=load(),period='month',off=0,pieL1=null,pieL2=null,queue=[],qi=0,pieC=null,radarC=null,amtStr='';
function load(){try{var j=JSON.parse(localStorage.getItem(KEY));return Object.assign({},DEF,j||{})}catch(e){return JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){alert('พื้นที่เก็บข้อมูลเต็ม กรุณา Export แล้วลบรายการเก่า')}}
var DICT=[
{k:['7-eleven','7eleven','seven','เซเว่น'],c:['Food & Drink','Groceries','7-Eleven']},
{k:['lotus','โลตัส','tesco'],c:['Food & Drink','Groceries','Lotus']},
{k:['big c','bigc','บิ๊กซี'],c:['Food & Drink','Groceries','Big C']},
{k:['makro','แม็คโคร'],c:['Food & Drink','Groceries','Makro']},
{k:['tops','ท็อปส์','villa market','gourmet'],c:['Food & Drink','Groceries','Supermarket']},
{k:['starbucks','สตาร์บัคส์','amazon','อเมซอน','coffee','กาแฟ'],c:['Food & Drink','Coffee','Cafe']},
{k:['mk','สุกี้','sizzler','shabu','ชาบู','bonchon','kfc','mcdonald','burger','pizza','ร้านอาหาร','restaurant','ศูนย์อาหาร'],c:['Food & Drink','Restaurant','Dining']},
{k:['grabfood','grab food','lineman','ไลน์แมน','foodpanda','robinhood','shopeefood'],c:['Food & Drink','Delivery','Food Delivery']},
{k:['ptt','ปตท','shell','เชลล์','esso','bangchak','บางจาก','caltex','น้ำมัน','fuel'],c:['Transport','Fuel','Gas Station']},
{k:['grab','bolt','uber','taxi','แท็กซี่','indrive'],c:['Transport','Ride-hailing','Grab/Bolt']},
{k:['bts','mrt','arl','รถไฟฟ้า','รถเมล์','ขสมก'],c:['Transport','Public','Rail/Bus']},
{k:['toll','ทางด่วน','easy pass','m-flow','parking','ที่จอดรถ'],c:['Transport','Toll & Parking','Road']},
{k:['rent','ค่าเช่า','หอพัก','condo','คอนโด'],c:['Housing','Rent','Monthly Rent']},
{k:['mea','pea','การไฟฟ้า','ค่าไฟ','electric'],c:['Housing','Utilities','Electricity']},
{k:['การประปา','ค่าน้ำ','water'],c:['Housing','Utilities','Water']},
{k:['ais','true','dtac','3bb','internet','อินเทอร์เน็ต','wifi'],c:['Housing','Internet & Phone','Telecom']},
{k:['shopee','ช้อปปี้'],c:['Shopping','Online','Shopee']},
{k:['lazada','ลาซาด้า'],c:['Shopping','Online','Lazada']},
{k:['tiktok','aliexpress','temu'],c:['Shopping','Online','Marketplace']},
{k:['uniqlo','zara','muji','ikea','central','robinson','เซ็นทรัล','โรบินสัน'],c:['Shopping','Retail','Department Store']},
{k:['watsons','วัตสัน','boots','pharmacy','ร้านขายยา'],c:['Health','Pharmacy','Drugstore']},
{k:['hospital','โรงพยาบาล','clinic','คลินิก','ทันตกรรม'],c:['Health','Medical','Hospital']},
{k:['fitness','ฟิตเนส','gym','yoga'],c:['Health','Fitness','Gym']},
{k:['netflix','spotify','youtube','disney','viu','iqiyi','hbo'],c:['Entertainment','Streaming','Subscription']},
{k:['steam','playstation','nintendo','garena','game'],c:['Entertainment','Games','Gaming']},
{k:['hotel','โรงแรม','airbnb','agoda','booking','airasia','flight','สายการบิน'],c:['Entertainment','Travel','Trip']},
{k:['major','sf cinema','เมเจอร์','โรงหนัง','cinema'],c:['Entertainment','Movie','Cinema']},
{k:['school','โรงเรียน','ค่าเทอม','university','มหาวิทยาลัย','course','คอร์ส','udemy','coursera'],c:['Education','Tuition','Course']},
{k:['book','หนังสือ','se-ed','ซีเอ็ด','kinokuniya','b2s'],c:['Education','Books','Bookstore']},
{k:['insurance','ประกัน','aia','prudential'],c:['Finance','Insurance','Premium']},
{k:['ค่าธรรมเนียม','fee','charge'],c:['Finance','Bank Fee','Charge']},
{k:['loan','สินเชื่อ','ผ่อน','installment','บัตรเครดิต','credit card'],c:['Finance','Loan','Installment']},
{k:['salary','เงินเดือน','payroll','ค่าจ้าง'],c:['Income','Salary','Monthly Salary'],t:'income'},
{k:['freelance','ฟรีแลนซ์','invoice','commission','คอมมิชชั่น'],c:['Income','Freelance','Project'],t:'income'},
{k:['refund','คืนเงิน','คืนภาษี','cashback','เงินคืน'],c:['Income','Refund','Cashback'],t:'income'},
{k:['dividend','ปันผล','ดอกเบี้ยรับ'],c:['Income','Investment','Dividend'],t:'income'},
{k:['โอนเข้า','เงินเข้า','รับเงิน','received','deposit'],c:['Income','Transfer In','Received'],t:'income'}];
var QUICK=[['Food & Drink','Restaurant','Dining'],['Food & Drink','Groceries','Supermarket'],['Transport','Ride-hailing','Grab/Bolt'],['Transport','Fuel','Gas Station'],['Shopping','Online','Marketplace'],['Housing','Utilities','Electricity'],['Health','Pharmacy','Drugstore'],['Entertainment','Streaming','Subscription'],['Income','Salary','Monthly Salary'],['Income','Freelance','Project'],['Other','Uncategorized','Misc']];
var INC_W=['รับเงิน','เงินเข้า','โอนเข้า','รายรับ','payroll','salary','refund','deposit','received','dividend','ปันผล','คืนเงิน'];
var SYM={THB:'฿',USD:'$'};
var PAL=['#00F0FF','#FF00E5','#CCFF00','#FFD700','#39FF14','#FF7A00','#9D4EDD','#FF2D55','#00FFB2','#5BC0FF'];
function fmt(n,cur){cur=cur||DB.disp;var v=Math.abs(n);return (n<0?'-':'')+SYM[cur]+v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function val(it){return DB.disp==='THB'?it.amountTHB:it.amountUSD}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function range(p,o){var n=new Date(),s,e,l;
if(p==='day'){s=new Date(n.getFullYear(),n.getMonth(),n.getDate()+o);e=new Date(s);l=s.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}
else if(p==='week'){var t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+o*7);var dw=(t.getDay()+6)%7;s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-dw);e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);l='WEEK '+s.toLocaleDateString('th-TH',{day:'numeric',month:'short'})+' - '+e.toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
else if(p==='month'){s=new Date(n.getFullYear(),n.getMonth()+o,1);e=new Date(n.getFullYear(),n.getMonth()+o+1,0);l=s.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}
else{s=new Date(n.getFullYear()+o,0,1);e=new Date(n.getFullYear()+o,11,31);l='YEAR '+s.getFullYear()}
return {s:iso(s),e:iso(e),l:l}}
function inR(p,o){var r=range(p,o);return DB.items.filter(function(i){return i.date>=r.s&&i.date<=r.e})}
function sum(a,t){return a.filter(function(i){return i.type===t}).reduce(function(x,i){return x+val(i)},0)}
function parseDate(t){var m=t.match(/(20\d{2}|25\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
if(m){var y=+m[1];if(y>2500)y-=543;return y+'-'+pad(+m[2])+'-'+pad(+m[3])}
m=t.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
if(m){var y2=+m[3];if(y2<100)y2+=2000;if(y2>2500)y2-=543;return y2+'-'+pad(+m[2])+'-'+pad(+m[1])}
return iso(new Date())}
function nums(s){var o=[],a=s.match(/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{1,2}|\d{2,6}/g)||[];
a.forEach(function(x){var v=parseFloat(x.replace(/,/g,''));if(!isNaN(v)&&v>0&&v<1e8)o.push(v)});return o}
function parseAmount(t){var L=t.split('\n'),KW=/total|amount|grand|net|sum|รวม|ยอดรวม|สุทธิ|ยอดชำระ|ชำระ|จำนวนเงิน|ยอดเงิน/i,best=0;
L.forEach(function(l){if(KW.test(l)){var n=nums(l);if(n.length)best=Math.max(best,Math.max.apply(null,n))}});
if(best)return best;
var all=nums(t.replace(/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/g,' ').replace(/\d{1,2}:\d{2}/g,' '));
return all.length?Math.max.apply(null,all):0}
function parseCur(t){return (/\$|usd|dollar/i.test(t)&&!/฿|thb|บาท/i.test(t))?'USD':'THB'}
function parseMerchant(t){var low=t.toLowerCase(),k;
for(k in DB.map){if(low.indexOf(k)>=0)return k}
for(var i=0;i<DICT.length;i++){for(var j=0;j<DICT[i].k.length;j++){if(low.indexOf(DICT[i].k[j])>=0)return DICT[i].k[j]}}
var L=t.split('\n').map(function(s){return s.trim()}).filter(function(s){return s.length>2&&/[A-Za-zก-๙]{3,}/.test(s)});
return L.length?L[0].slice(0,34):'Unknown'}
function categorize(t,merch){var low=(t+' '+merch).toLowerCase();
if(DB.map[merch])return DB.map[merch];
for(var i=0;i<DICT.length;i++){for(var j=0;j<DICT[i].k.length;j++){if(low.indexOf(DICT[i].k[j])>=0)return {c:DICT[i].c,t:DICT[i].t||'expense'}}}
var inc=INC_W.some(function(w){return low.indexOf(w)>=0});
return {c:['Other','Uncategorized','Misc'],t:inc?'income':'expense'}}
function fxFetch(){var today=iso(new Date());
if(DB.fx.date===today&&DB.fx.live){paintFx();return Promise.resolve()}
return fetch('https://open.er-api.com/v6/latest/USD').then(function(r){return r.json()})
.then(function(j){if(j&&j.rates&&j.rates.THB){DB.fx={rate:+j.rates.THB.toFixed(4),date:today,live:true};save()}paintFx()})
.catch(function(){DB.fx.live=false;paintFx()})}
function paintFx(){var r=DB.fx.rate.toFixed(2);
document.getElementById('fxLine').textContent='FX · $1 = ฿'+r+(DB.fx.live?' · LIVE':' · CACHED');
document.getElementById('kFx').textContent='$1 = ฿'+r}
function render(){var r=range(period,off);document.getElementById('rangeLbl').textContent=r.l;
var it=inR(period,off),I=sum(it,'income'),E=sum(it,'expense'),N=I-E;
document.getElementById('kIn').textContent=fmt(I);
document.getElementById('kEx').textContent=fmt(E);
var kn=document.getElementById('kNet');kn.textContent=fmt(N);kn.className='val '+(N>=0?'glow-g':'glow-r');
paintFx();drawPie(it);drawRadar();drawList()}
function groupBy(it,lvl){var g={};
it.filter(function(x){return x.type==='expense'}).filter(function(x){return (!pieL1||x.L1===pieL1)&&(!pieL2||x.L2===pieL2)})
.forEach(function(x){var k=x['L'+lvl]||'-';g[k]=(g[k]||0)+val(x)});
return Object.keys(g).map(function(k){return [k,g[k]]}).sort(function(a,b){return b[1]-a[1]})}
function drawPie(it){var lvl=pieL2?3:(pieL1?2:1),d=groupBy(it,lvl);
document.getElementById('crumb').innerHTML=pieL1?'<span style="cursor:pointer" onclick="pieUp()">BACK</span> · '+esc(pieL1)+(pieL2?' > '+esc(pieL2):''):'LAYER 1 - TAP SLICE';
var cv=document.getElementById('pie');if(pieC){pieC.destroy();pieC=null}
if(!d.length)return;
pieC=new Chart(cv,{type:'doughnut',data:{labels:d.map(function(x){return x[0]}),datasets:[{data:d.map(function(x){return x[1]}),backgroundColor:PAL.map(function(c){return c+'CC'}),borderColor:'#0A0A0F',borderWidth:2,hoverOffset:10}]},

function report(){var cur=inR(period,off),prv=inR(period,off-1),r=range(period,off),tree={},pT={};
cur.forEach(function(x){var s=x.type==='income'?val(x):-val(x);

var b=a.s[x.L2]=a.s[x.L2]||{t:0,s:{}};b.t+=s;
b.s[x.L3]=(b.s[x.L3]||0)+s});
prv.forEach(function(x){pT[x.L1]=(pT[x.L1]||0)+(x.type==='income'?val(x):-val(x))});
var rows='';
Object.keys(tree).sort(function(a,b){return Math.abs(tree[b].t)-Math.abs(tree[a].t)}).forEach(function(k){
var a=tree[k],p=pT[k]||0,d=a.t-p,ar=d===0?'=':(d>0?'UP':'DOWN');
rows+='<tr><td class="gold"><b>'+esc(k)+'</b></td><td class="r '+(a.t>=0?'glow-g':'glow-r')+'"><b>'+fmt(a.t)+'</b></td><td class="r" style="color:'+(d>=0?'#39FF14':'#FF2D55')+'">'+ar+' '+fmt(Math.abs(d))+'</td></tr>';
Object.keys(a.s).sort(function(x,y){return Math.abs(a.s[y].t)-Math.abs(a.s[x].t)}).forEach(function(k2){
var b=a.s[k2];
rows+='<tr><td style="padding-left:16px" class="cyan">> '+esc(k2)+'</td><td class="r">'+fmt(b.t)+'</td><td></td></tr>';
Object.keys(b.s).sort(function(x,y){return Math.abs(b.s[y])-Math.abs(b.s[x])}).forEach(function(k3){
rows+='<tr><td style="padding-left:34px;color:#7A7A93">>> '+esc(k3)+'</td><td class="r" style="color:#9A9AB5">'+fmt(b.s[k3])+'</td><td></td></tr>'})})});

function shrink(file,max){return new Promise(function(res){var r=new FileReader();
r.onload=function(){var im=new Image();im.onload=function(){
var s=Math.min(1,max/Math.max(im.width,im.height));
var c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};im.src=r.result};
r.readAsDataURL(file)})}
document.getElementById('fab').onclick=function(){document.getElementById('fileIn').click()};
document.getElementById('fileIn').onchange=function(e){
var fs=[].slice.call(e.target.files);e.target.value='';if(!fs.length)return;
openS('<h2 class="cyan">READING RECEIPTS</h2><div class="hint" id="st">เตรียม OCR (ครั้งแรกโหลดโมเดล ~15MB)</div><div class="prog"><i id="pb"></i></div>');
queue=[];
Tesseract.createWorker(['tha','eng']).then(function(W){
var i=0;
function step(){
if(i>=fs.length){W.terminate();qi=0;review();return}
document.getElementById('st').textContent='ไฟล์ '+(i+1)+' / '+fs.length+' กำลังวิเคราะห์';
document.getElementById('pb').style.width=(i/fs.length*100)+'%';
shrink(fs[i],1000).then(function(big){
return W.recognize(big).then(function(r){return r.data.text}).catch(function(){return ''})
.then(function(txt){return shrink(fs[i],220).then(function(th){
var merch=parseMerchant(txt),cat=categorize(txt,merch);
queue.push({img:th,raw:txt,merchant:merch,date:parseDate(txt),amount:parseAmount(txt)||0,cur:parseCur(txt),
L1:cat.c[0],L2:cat.c[1],L3:cat.c[2]==='Misc'?(merch.slice(0,22)||'Misc'):cat.c[2],type:cat.t||'expense'});
i++;step()})})})}
step()}).catch(function(){closeS();alert('โหลด OCR ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต')})};
function review(){if(qi>=queue.length){queue=[];closeS();render();return}
amtStr=(queue[qi].amount||0).toFixed(2);paintReview()}
function paintReview(){var q=queue[qi];
var seen={},sug=[];
[[q.L1,q.L2,q.L3]].concat(QUICK).forEach(function(c){var k=c.join('|');if(!seen[k]){seen[k]=1;sug.push(c)}});
sug=sug.slice(0,10);
openS('<h2 class="gold">CHECK '+(qi+1)+'/'+queue.length+'</h2>'+
'<img class="shot" src="'+q.img+'">'+
'<div class="hint">อ่านได้: <b class="cyan">'+esc(q.merchant)+'</b></div>'+
'<div class="sec">ประเภท</div><div class="chips">'+
'<button class="chip '+(q.type==='expense'?'on':'')+'" onclick="setF(\'type\',\'expense\')">- รายจ่าย</button>'+

'<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(function(n){return '<button onclick="key(\''+n+'\')">'+n+'</button>'}).join('')+
'<button onclick="key(\'.\')">.</button><button onclick="key(\'0\')">0</button><button onclick="key(\'x\')">DEL</button>'+
'<button onclick="step2(-100)">-100</button><button onclick="step2(-10)">-10</button><button onclick="step2(10)">+10</button></div>'+
'<div class="sec">วันที่</div><div class="chips">'+
'<button class="chip sm" onclick="dstep(-1)">PREV</button>'+
'<button class="chip on">'+q.date+'</button>'+

sug.map(function(c,ix){return '<button class="chip sm '+(c[0]===q.L1&&c[1]===q.L2?'on':'')+'" onclick="setCat('+ix+')">'+esc(c[0])+' > '+esc(c[1])+'</button>'}).join('')+'</div>'+
'<button class="big ok" onclick="commit()">บันทึก</button>'+
'<button class="big no" onclick="skip()">ข้ามรูปนี้</button>');
window._sug=sug}
function setF(k,v){queue[qi][k]=v;paintReview()}
function setCat(ix){var c=window._sug[ix],q=queue[qi];q.L1=c[0];q.L2=c[1];
q.L3=(c[2]==='Misc'?q.merchant.slice(0,22):c[2]);if(c[0]==='Income')q.type='income';paintReview()}
function key(k){if(k==='x')amtStr=amtStr.slice(0,-1);
else if(k==='.'){if(amtStr.indexOf('.')<0)amtStr+='.'}
else amtStr+=k;
if(amtStr.replace('.','').length>11)amtStr=amtStr.slice(0,-1);
queue[qi].amount=parseFloat(amtStr)||0;paintReview()}
function step2(d){var v=Math.max(0,(parseFloat(amtStr)||0)+d);amtStr=v.toFixed(2);queue[qi].amount=v;paintReview()}
function dstep(d){var t=new Date(queue[qi].date+'T00:00:00');t.setDate(t.getDate()+d);queue[qi].date=iso(t);paintReview()}
