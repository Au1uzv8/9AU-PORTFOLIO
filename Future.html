<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>James — Memory & Skill System</title>
    <!-- React & Babel for in-browser JSX transformation -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-sans: 'IBM Plex Sans Thai', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --surface-0: #0f172a;
            --surface-1: #1e293b;
            --border: #334155;
            --border-accent: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-accent: #60a5fa;
            --bg-accent: #1e3a8a;
            --bg-success: #064e3b;
            --text-success: #34d399;
            --fill-success: #10b981;
            --bg-warning: #78350f;
            --text-warning: #fbbf24;
            --fill-warning: #f59e0b;
            --bg-danger: #7f1d1d;
            --text-danger: #fca5a5;
            --bg-pro: #312e81;
            --text-pro: #a78bfa;
            --radius: 8px;
        }

        body {
            margin: 0;
            background-color: var(--surface-0);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        * {
            box-sizing: border-box;
        }

        button {
            font-family: var(--font-sans);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Card = ({ children, style = {} }) => (
          <div style={{
            background: "var(--surface-1)", border: "0.5px solid var(--border)",
            borderRadius: 12, padding: "1rem 1.25rem", ...style
          }}>{children}</div>
        );

        const SectionH = ({ children }) => (
          <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 10, color: "var(--text-primary)" }}>{children}</div>
        );

        const Dot = ({ color }) => (
          <div style={{ width: 7, height: 7, borderRadius: "50%", background: color, flexShrink: 0, marginTop: 5 }} />
        );

        function Overview() {
          return (
            <div>
              <p style={{ fontSize: 13, color: "var(--text-secondary)", marginBottom: "1.5rem", lineHeight: 1.7 }}>
                James ใช้ 3 ชั้น context ทำงานร่วมกัน — แต่ละชั้นมีธรรมชาติและวิธีใช้ต่างกัน
              </p>

              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: "1.5rem" }}>
                {[
                  {
                    icon: "ti-database", label: "Memory Layer", tag: "Persistent",
                    tagBg: "var(--bg-success)", tagColor: "var(--text-success)",
                    bg: "#064e3b", border: "#059669", textColor: "#a7f3d0", subColor: "#6ee7b7",
                    desc: "ข้อมูลถาวรที่ James จำไว้ข้ามทุก Session ใน Project นี้",
                    chips: ["user_edits (explicit)", "userMemories (auto)"],
                    chipBg: "#022c22", chipText: "#a7f3d0"
                  },
                  {
                    icon: "ti-file-code", label: "Skill Layer", tag: "On-demand",
                    tagBg: "var(--bg-pro)", tagColor: "var(--text-pro)",
                    bg: "#312e81", border: "#6366f1", textColor: "#c7d2fe", subColor: "#a5b4fc",
                    desc: "SKILL.md — James อ่านก่อนทำงาน บอกวิธีทำงานสำหรับงานเฉพาะประเภท",
                    chips: ["public skills", "user skills (mql5-expert)"],
                    chipBg: "#1e1b4b", chipText: "#c7d2fe"
                  },
                  {
                    icon: "ti-history", label: "Context Layer", tag: "Manual inject",
                    tagBg: "var(--bg-warning)", tagColor: "var(--text-warning)",
                    bg: "#78350f", border: "#d97706", textColor: "#fef3c7", subColor: "#fde68a",
                    desc: "Context_Summary.md — บันทึกประวัติการทำงาน, Fix log, Decision rationale",
                    chips: ["Session history", "Fix log + rationale"],
                    chipBg: "#451a03", chipText: "#fef3c7"
                  }
                ].map((item, i) => (
                  <div key={i} style={{
                    background: item.bg, border: `0.5px solid ${item.border}`,
                    borderRadius: 12, padding: "1rem 1.25rem"
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <i className={`ti ${item.icon}`} style={{ fontSize: 18, color: item.subColor }} aria-hidden="true" />
                        <div>
                          <div style={{ fontSize: 13, fontWeight: 500, color: item.textColor }}>{item.label}</div>
                          <div style={{ fontSize: 12, color: item.subColor, marginTop: 2 }}>{item.desc}</div>
                        </div>
                      </div>
                      <span style={{
                        background: item.tagBg, color: item.tagColor,
                        fontSize: 11, padding: "2px 8px", borderRadius: "var(--radius)", whiteSpace: "nowrap"
                      }}>{item.tag}</span>
                    </div>
                    <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                      {item.chips.map((c, j) => (
                        <div key={j} style={{
                          background: item.chipBg, borderRadius: 8,
                          padding: "4px 10px", fontSize: 11, color: item.chipText
                        }}>{c}</div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              <Card>
                <SectionH>ความแตกต่างสำคัญในทางปฏิบัติ</SectionH>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
                  {[
                    { label: "Memory", color: "#34d399", bg: "#064e3b", items: ["จำอัตโนมัติ", "ข้ามทุก session", "สรุปเท่านั้น — ไม่เก็บ full schema"] },
                    { label: "Skill", color: "#a78bfa", bg: "#312e81", items: ["อ่านก่อนทำงาน", "บอกวิธีทำ (procedural)", "James trigger อัตโนมัติ"] },
                    { label: "Context_Summary", color: "#fbbf24", bg: "#78350f", items: ["วางมือเองต้น session", "บันทึก history (historical)", "Inject บริบทเฉพาะ session"] },
                  ].map((col, i) => (
                    <div key={i} style={{ background: col.bg, borderRadius: 8, padding: "12px" }}>
                      <div style={{ fontSize: 12, fontWeight: 500, color: col.color, marginBottom: 8 }}>{col.label}</div>
                      {col.items.map((item, j) => (
                        <div key={j} style={{ fontSize: 11, color: col.color, marginBottom: 4, display: "flex", gap: 5 }}>
                          <span>•</span><span>{item}</span>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              </Card>
            </div>
          );
        }

        function MemorySection() {
          const [activeType, setActiveType] = useState(0);

          const types = [
            {
              label: "user_edits", sublabel: "Explicit — พี่อูสั่งโดยตรง",
              bg: "#064e3b", border: "#059669", textColor: "#a7f3d0",
              stored: [
                "INDEX table — shortcut registry ทั้งหมด",
                "VERIFY / EXPORT-EA / COMBINE / ADAPTIVE / MT5-MCP",
                "Key principles & learnings จาก session ต่างๆ",
                "Open issues ที่ยังค้างอยู่ (เช่น YAML field count)"
              ],
              limits: [
                "Max 30 entries ต่อ Project",
                "Max 100,000 chars ต่อ entry",
                "สั่งได้ทุกเวลา: 'James — จำไว้ว่า...'",
                "ลบได้: 'James — ลืมเรื่อง...'"
              ]
            },
            {
              label: "userMemories", sublabel: "Auto-generated — ระบบสร้างจาก conversation",
              bg: "#1e3a8a", border: "#3b82f6", textColor: "#bfdbfe",
              stored: [
                "Background: EA Developer, Early Retired",
                "Tools: MT5, Obsidian, GitHub Pages, Claude Desktop",
                "Communication style preferences",
                "Context เกี่ยวกับ EA projects ต่างๆ"
              ],
              limits: [
                "อัปเดต delay — session ล่าสุดอาจยังไม่สะท้อน",
                "ไม่เก็บ full schema / template / field list",
                "Disabled ใน Incognito Conversations",
                "ระบบ summarize — ไม่ใช่ raw text"
              ]
            }
          ];

          const t = types[activeType];

          return (
            <div>
              <div style={{ display: "flex", gap: 8, marginBottom: "1.5rem" }}>
                {types.map((ty, i) => (
                  <button key={i} onClick={() => setActiveType(i)} style={{
                    flex: 1, background: activeType === i ? ty.bg : "var(--surface-1)",
                    border: activeType === i ? `0.5px solid ${ty.border}` : "0.5px solid var(--border)",
                    borderRadius: 12, padding: "12px 14px", cursor: "pointer", textAlign: "left",
                    color: activeType === i ? ty.textColor : "var(--text-primary)"
                  }}>
                    <div style={{ fontSize: 13, fontWeight: 500 }}>{ty.label}</div>
                    <div style={{ fontSize: 11, color: activeType === i ? ty.textColor : "var(--text-secondary)", opacity: 0.8, marginTop: 3 }}>{ty.sublabel}</div>
                  </button>
                ))}
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: "1.5rem" }}>
                <Card>
                  <SectionH>สิ่งที่เก็บไว้ตอนนี้</SectionH>
                  {t.stored.map((item, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "flex-start" }}>
                      <Dot color="var(--fill-success)" />
                      <div style={{ fontSize: 12, lineHeight: 1.5, color: "var(--text-secondary)" }}>{item}</div>
                    </div>
                  ))}
                </Card>
                <Card>
                  <SectionH>ข้อจำกัด</SectionH>
                  {t.limits.map((item, i) => (
                    <div key={i} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "flex-start" }}>
                      <Dot color="var(--fill-warning)" />
                      <div style={{ fontSize: 12, lineHeight: 1.5, color: "var(--text-secondary)" }}>{item}</div>
                    </div>
                  ))}
                </Card>
              </div>

              <Card style={{ marginBottom: "1.5rem" }}>
                <SectionH>Scope — Project Isolation</SectionH>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ flex: 1, background: "var(--bg-danger)", borderRadius: 8, padding: "10px 12px" }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: "var(--text-danger)", marginBottom: 4 }}>ข้ามไม่ได้</div>
                    <div style={{ fontSize: 12, color: "var(--text-danger)", lineHeight: 1.5, opacity: 0.9 }}>Memory ไม่ข้ามระหว่าง Claude Projects แต่ละ Project มี memory space แยกกันอย่างสมบูรณ์</div>
                  </div>
                  <div style={{ flex: 1, background: "var(--bg-success)", borderRadius: 8, padding: "10px 12px" }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: "var(--text-success)", marginBottom: 4 }}>ใน Project นี้</div>
                    <div style={{ fontSize: 12, color: "var(--text-success)", lineHeight: 1.5, opacity: 0.9 }}>James จำได้ทุก session ภายใน Project เดียวกัน — ไม่ต้องแนะนำตัวซ้ำ</div>
                  </div>
                </div>
              </Card>

              <Card>
                <SectionH>Backup & Restore</SectionH>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 8 }}>Export</div>
                    <div style={{ background: "var(--surface-0)", borderRadius: 8, padding: "8px 12px", fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-accent)", border: "1px solid var(--border)" }}>
                      James — Export Memory Backup
                    </div>
                    <div style={{ fontSize: 12, color: "var(--text-secondary)", marginTop: 6, lineHeight: 1.5 }}>James สร้าง .md file ให้ download ได้ทันที</div>
                  </div>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 8 }}>Restore</div>
                    <div style={{ background: "var(--surface-0)", borderRadius: 8, padding: "8px 12px", fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--text-accent)", border: "1px solid var(--border)" }}>
                      James — Import Memory Backup [แนบ .md]
                    </div>
                    <div style={{ fontSize: 12, color: "var(--text-secondary)", marginTop: 6, lineHeight: 1.5 }}>วาง Backup file แล้วให้ James อ่านและ restore</div>
                  </div>
                </div>
                <div style={{ background: "var(--bg-warning)", borderRadius: 8, padding: "8px 12px", marginTop: 12 }}>
                  <div style={{ fontSize: 12, color: "var(--text-warning)" }}>ควรเก็บ Backup ไว้ใน $Context Summary folder เดิม — ชื่อไฟล์แนะนำ: James_Memory_Backup_YYYY-MM-DD.md</div>
                </div>
              </Card>
            </div>
          );
        }

        function SkillSection() {
          const [selected, setSelected] = useState(null);

          const skills = [
            { name: "mql5-expert", type: "user", desc: "MQL5 EA development — syntax, OnInit/OnTick, CopyBuffer, CTrade, backtest review", trigger: "เมื่อเขียน / รีวิว / debug MQL5 หรือถามเรื่อง EA" },
            { name: "docx", type: "public", desc: "สร้างหรือแก้ไข Word documents (.docx, .dotx)", trigger: "เมื่อต้องการไฟล์ Word / รายงาน / memo" },
            { name: "pdf", type: "public", desc: "อ่าน / สร้าง / แก้ไข / merge PDF files", trigger: "เมื่อมีไฟล์ PDF เกี่ยวข้อง" },
            { name: "xlsx", type: "public", desc: "สร้างหรือแก้ไข spreadsheet (.xlsx, .csv)", trigger: "เมื่อต้องการ spreadsheet หรือ data table" },
            { name: "frontend-design", type: "public", desc: "UI design guidance, CDS tokens, CSS variables, visual design", trigger: "เมื่อสร้าง React / HTML UI" },
            { name: "file-reading", type: "public", desc: "Router — บอกวิธีอ่านแต่ละ file type จาก uploads folder", trigger: "เมื่อมี uploaded file ที่ยังไม่ได้อ่าน" },
            { name: "morning", type: "example", desc: "Render morning brief เป็น HTML artifact", trigger: "เมื่อพิมพ์ /morning หรือขอ morning brief" },
            { name: "skill-creator", type: "example", desc: "สร้าง / แก้ไข / eval Skill ใหม่", trigger: "เมื่อต้องการสร้างหรือปรับปรุง SKILL.md" },
          ];

          const typeColor = { user: { bg: "#312e81", text: "#a78bfa" }, public: { bg: "#064e3b", text: "#34d399" }, example: { bg: "#78350f", text: "#fbbf24" } };

          return (
            <div>
              <Card style={{ marginBottom: "1.5rem" }}>
                <SectionH>Context_Summary.md vs SKILL.md</SectionH>
                <div style={{ display: "grid", gridTemplateColumns: "1fr auto 1fr", gap: 12, alignItems: "start" }}>
                  <div style={{ background: "#78350f", borderRadius: 8, padding: "12px" }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: "#fef3c7", marginBottom: 8 }}>Context_Summary.md</div>
                    {["Historical record", "เกิดอะไรขึ้น — เพราะอะไร", "Fix log + test results", "Decision rationale", "วางมือเองต้น session"].map((t, i) => (
                      <div key={i} style={{ fontSize: 11, color: "#fde68a", marginBottom: 4 }}>• {t}</div>
                    ))}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, paddingTop: 12 }}>
                    <div style={{ fontSize: 11, color: "var(--text-muted)" }}>distill</div>
                    <div style={{ fontSize: 18, color: "var(--text-muted)" }}>→</div>
                    <div style={{ fontSize: 11, color: "var(--text-muted)" }}>patterns</div>
                  </div>
                  <div style={{ background: "#312e81", borderRadius: 8, padding: "12px" }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: "#c7d2fe", marginBottom: 8 }}>SKILL.md</div>
                    {["Procedural guide", "ทำอย่างไร — ตาม pattern ไหน", "Rules + constraints", "Step-by-step process", "James อ่านอัตโนมัติก่อนทำงาน"].map((t, i) => (
                      <div key={i} style={{ fontSize: 11, color: "#a5b4fc", marginBottom: 4 }}>• {t}</div>
                    ))}
                  </div>
                </div>
                <div style={{ background: "var(--bg-accent)", borderRadius: 8, padding: "8px 12px", marginTop: 10 }}>
                  <div style={{ fontSize: 12, color: "var(--text-accent)", lineHeight: 1.5 }}>
                    ตัวอย่าง: Context_Summary V19.8 มี HardSL Tuning logic → distill เป็น rule ใน mql5-expert SKILL.md: "เมื่อ DD ลึกผิดปกติ ให้ตรวจ HardSLMultiplier vs ATRMultiplier ก่อน"
                  </div>
                </div>
              </Card>

              <SectionH>Skills ที่ติดตั้งอยู่ในระบบ</SectionH>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {skills.map((sk, i) => (
                  <div key={i} onClick={() => setSelected(selected === i ? null : i)} style={{
                    background: selected === i && sk.type === "user" ? "#312e81" : "var(--surface-1)",
                    border: selected === i ? `0.5px solid ${sk.type === "user" ? "#6366f1" : "var(--border-accent)"}` : "0.5px solid var(--border)",
                    borderRadius: 12, padding: "10px 14px", cursor: "pointer"
                  }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <code style={{ fontSize: 12, fontWeight: 500, background: "var(--surface-0)", color: "var(--text-primary)", padding: "2px 6px", borderRadius: 4, border: "1px solid var(--border)" }}>{sk.name}</code>
                        <span style={{ fontSize: 10, padding: "1px 6px", borderRadius: 4, background: typeColor[sk.type].bg, color: typeColor[sk.type].text }}>{sk.type}</span>
                      </div>
                      <i className={`ti ti-chevron-${selected === i ? "up" : "down"}`} style={{ fontSize: 14, color: "var(--text-muted)" }} aria-hidden="true" />
                    </div>
                    {selected === i && (
                      <div style={{ marginTop: 8, paddingTop: 8, borderTop: "0.5px solid var(--border)" }}>
                        <div style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 6, lineHeight: 1.5 }}>{sk.desc}</div>
                        <div style={{ fontSize: 12 }}>
                          <span style={{ color: "var(--text-muted)" }}>Trigger: </span>
                          <span style={{ color: "var(--text-accent)" }}>{sk.trigger}</span>
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          );
        }

        function WorkflowSection() {
          const [step, setStep] = useState(0);

          const steps = [
            {
              label: "Start Session", icon: "ti-player-play",
              bg: "#064e3b", border: "#059669", textColor: "#a7f3d0",
              title: "เริ่ม Session ใหม่",
              desc: "James โหลด Memory อัตโนมัติ (user_edits + userMemories) ก่อนตอบทุกครั้ง ไม่ต้องทำอะไรพิเศษ",
              actions: [
                "พิมพ์ prompt เปิด session — James โหลด Memory อัตโนมัติ",
                "ถ้างานต่อจาก session เก่า → แนบ Context_Summary.md พร้อม prompt",
                "James อ่าน Context_Summary ทำความเข้าใจ version history + rationale",
                "ถ้างาน MQL5 → James โหลด mql5-expert SKILL.md อัตโนมัติ"
              ],
              tip: "ใช้ Prompt Template ท้าย Context_Summary.md:\n\"James — อ่าน Context Summary [EA] นี้แล้วครับ วันนี้จะทำ: [งาน]\""
            },
            {
              label: "Work", icon: "ti-code",
              bg: "#1e3a8a", border: "#3b82f6", textColor: "#bfdbfe",
              title: "ทำงานระหว่าง Session",
              desc: "James ทำงานโดยใช้ Context ที่มีใน session + Memory ที่โหลดมา + Skills ที่เกี่ยวข้อง",
              actions: [
                "ใช้ shortcut commands: INDEX / VERIFY / EXPORT-EA / COMBINE / ADAPTIVE / MT5-MCP",
                "James อ้างอิง Skill ที่เกี่ยวข้องโดยอัตโนมัติ",
                "อัปเดต Memory ทันทีถ้ามี key learning: 'James — จำไว้ว่า...'",
                "Session ยาวเกินไป → เปิด session ใหม่ (quality ลดใน long chat)"
              ],
              tip: "Session สั้น focused ให้ผลดีกว่า session ยาว — แบ่งงานเป็น session ย่อยๆ ตามหัวข้อ"
            },
            {
              label: "End Session", icon: "ti-file-text",
              bg: "#78350f", border: "#d97706", textColor: "#fef3c7",
              title: "ปิด Session — สร้าง Context_Summary.md",
              desc: "บันทึกทุกอย่างที่เกิดขึ้น รวม rationale และผลทดสอบ เพื่อให้ session ต่อไปเข้าใจได้ทันที",
              actions: [
                "James สร้าง Context_Summary.md ตาม format มาตรฐาน",
                "Section หลัก: Version history / Fix log / Test results / Decision rationale / Remaining steps",
                "จัดเก็บ: D:\\#Projects\\MQL5\\$Context Summary\\ ตาม naming convention",
                "อัปเดต Memory: 'James — จำไว้ว่า...' สำหรับ key learning ใหม่"
              ],
              tip: "Context_Summary ที่ดี = คนอ่านใหม่เข้าใจได้ทันทีว่าทำไปถึงไหน เพราะอะไร และต้องทำอะไรต่อ — ไม่ต้องถามซ้ำ"
            },
            {
              label: "Extract Skill", icon: "ti-sparkles",
              bg: "#312e81", border: "#6366f1", textColor: "#c7d2fe",
              title: "(Optional) Distill Context → Skill",
              desc: "เมื่อพบ pattern ที่จะกลับมาใช้ซ้ำ → แปลง historical record เป็น procedural guide",
              actions: [
                "Extract rules / constraints / patterns จาก Context_Summary",
                "เขียนเป็น SKILL.md format: 'ทำอย่างไร' ไม่ใช่ 'เกิดอะไรขึ้น'",
                "เพิ่มใน /mnt/skills/user/ เพื่อให้ James โหลดอัตโนมัติ",
                "ตัวอย่าง: HardSL Tuning logic จาก V19.8 → rule ใน mql5-expert SKILL.md"
              ],
              tip: "ไม่จำเป็นต้องทำทุก session — ทำเมื่อ pattern นั้นจะกลับมาใช้ซ้ำในงาน EA อื่นๆ"
            }
          ];

          const s = steps[step];

          return (
            <div>
              <div style={{ display: "flex", gap: 0, marginBottom: "1.5rem", borderRadius: 12, overflow: "hidden", border: "0.5px solid var(--border)" }}>
                {steps.map((st, i) => (
                  <button key={i} onClick={() => setStep(i)} style={{
                    flex: 1, background: step === i ? st.bg : "var(--surface-1)",
                    border: "none", borderRight: i < steps.length - 1 ? "0.5px solid var(--border)" : "none",
                    padding: "10px 6px", cursor: "pointer", textAlign: "center",
                    color: step === i ? st.textColor : "var(--text-secondary)"
                  }}>
                    <i className={`ti ${st.icon}`} style={{ fontSize: 16, color: step === i ? st.textColor : "var(--text-muted)", display: "block", marginBottom: 4 }} aria-hidden="true" />
                    <div style={{ fontSize: 11, fontWeight: 500 }}>{st.label}</div>
                  </button>
                ))}
              </div>

              <div style={{
                background: s.bg, border: `0.5px solid ${s.border}`,
                borderRadius: 12, padding: "1rem 1.25rem", marginBottom: "1.5rem"
              }}>
                <div style={{ fontSize: 15, fontWeight: 500, color: s.textColor, marginBottom: 6 }}>{s.title}</div>
                <div style={{ fontSize: 12, color: s.textColor, opacity: 0.9, marginBottom: "1rem", lineHeight: 1.6 }}>{s.desc}</div>
                {s.actions.map((act, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "flex-start", gap: 8, marginBottom: 8 }}>
                    <div style={{
                      width: 20, height: 20, borderRadius: "50%", background: "rgba(255,255,255,0.15)",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 11, fontWeight: 500, color: s.textColor, flexShrink: 0
                    }}>{i + 1}</div>
                    <div style={{ fontSize: 12, color: s.textColor, lineHeight: 1.6, opacity: 0.95 }}>{act}</div>
                  </div>
                ))}
              </div>

              <Card style={{ marginBottom: "1.5rem" }}>
                <div style={{ fontSize: 11, color: "var(--text-muted)", marginBottom: 4 }}>Practical tip</div>
                <div style={{ fontSize: 12, color: "var(--text-secondary)", lineHeight: 1.7, whiteSpace: "pre-line" }}>{s.tip}</div>
              </Card>

              <Card>
                <SectionH>Session Loop — ภาพรวม</SectionH>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}>
                  {steps.map((st, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, flex: 1 }}>
                      <div onClick={() => setStep(i)} style={{
                        flex: 1, height: 6, borderRadius: 3, cursor: "pointer",
                        background: step === i ? st.border : (step > i ? "#475569" : "var(--border)")
                      }} />
                      {i < steps.length - 1 && <div style={{ fontSize: 12, color: "var(--text-muted)", flexShrink: 0 }}>›</div>}
                    </div>
                  ))}
                </div>
                <div style={{ display: "flex", gap: 4 }}>
                  {steps.map((st, i) => (
                    <div key={i} style={{ flex: 1, fontSize: 10, color: step === i ? "var(--text-primary)" : "var(--text-muted)", textAlign: "center" }}>{st.label}</div>
                  ))}
                </div>
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
                  <div style={{ fontSize: 11, color: "var(--text-muted)" }}>↺ วนซ้ำทุก Session</div>
                </div>

                <div style={{ borderTop: "0.5px solid var(--border)", marginTop: 16, paddingTop: 16 }}>
                  <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 8, color: "var(--text-primary)" }}>Key rule สำหรับ Knowledge ที่ต้องเก็บ</div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                    {[
                      { where: "Memory", what: "Summarized facts, shortcuts, key learnings", color: "#34d399", bg: "#064e3b" },
                      { where: "SKILL.md", what: "Procedural rules, constraints, repeatable patterns", color: "#a78bfa", bg: "#312e81" },
                      { where: "Knowledge Base", what: "Full schemas, field lists, templates, complete data", color: "#fbbf24", bg: "#78350f" }
                    ].map((row, i) => (
                      <div key={i} style={{ background: row.bg, borderRadius: 8, padding: "10px" }}>
                        <div style={{ fontSize: 11, fontWeight: 500, color: row.color, marginBottom: 4 }}>{row.where}</div>
                        <div style={{ fontSize: 11, color: row.color, lineHeight: 1.4, opacity: 0.9 }}>{row.what}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </Card>
            </div>
          );
        }

        function App() {
          const [activeTab, setActiveTab] = useState(0);
          const tabLabels = ["ภาพรวม", "Memory", "Skill", "Workflow"];
          const tabs = [<Overview />, <MemorySection />, <SkillSection />, <WorkflowSection />];

          return (
            <div style={{ fontFamily: "var(--font-sans)", color: "var(--text-primary)", padding: "1.5rem 1rem", maxWidth: "800px", margin: "0 auto" }}>
              <div style={{ marginBottom: "1.25rem" }}>
                <div style={{ fontSize: 17, fontWeight: 500, marginBottom: 3 }}>James — Memory & Skill System</div>
                <div style={{ fontSize: 12, color: "var(--text-secondary)" }}>ภาพรวมระบบ Context Management สำหรับ EA Development Workflow</div>
              </div>

              <div style={{ display: "flex", gap: 6, marginBottom: "1.5rem", borderBottom: "0.5px solid var(--border)", paddingBottom: 8 }}>
                {tabLabels.map((t, i) => (
                  <button key={i} onClick={() => setActiveTab(i)} style={{
                    background: activeTab === i ? "var(--bg-accent)" : "transparent",
                    color: activeTab === i ? "var(--text-accent)" : "var(--text-secondary)",
                    border: activeTab === i ? "0.5px solid var(--border-accent)" : "0.5px solid transparent",
                    borderRadius: "var(--radius)", padding: "6px 14px", fontSize: 13,
                    cursor: "pointer", fontFamily: "var(--font-sans)"
                  }}>{t}</button>
                ))}
              </div>

              {tabs[activeTab]}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
