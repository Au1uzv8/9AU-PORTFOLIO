<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M1MSaving — Saving & Investment Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#070b0a; --panel:#0d1211; --line:#1a2622;
  --text:#e2e8f0; --muted:#8fa39c; --dim:#5c6b66;
  --green:#00ff9d; --glow:rgba(0,255,157,.18);
  --blue:#38bdf8; --red:#fb7185; --amber:#fbbf24; --purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Prompt',sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1.25rem 4rem;overflow-x:hidden;}
.wrap{max-width:1280px;margin:0 auto;}

/* เครื่องหมายให้ JS จับไปสั่งเคลื่อนไหว (Web Animations API) */
.fx,.fx-b,.fx-t{display:inline-block;will-change:transform;}
.fx-t{display:inline-flex;}

header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
  padding-bottom:1.1rem;margin-bottom:1.5rem;border-bottom:1px solid var(--line);}
.logo{font-size:1.55rem;font-weight:700;letter-spacing:.3px;}
.badge{display:flex;align-items:center;gap:.55rem;background:var(--panel);
  border:1px solid var(--line);padding:.45rem 1rem;border-radius:999px;font-size:.85rem;color:var(--muted);}
.badge i{color:var(--green);}

/* Summary Cards */
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:1.5rem;}
.scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.25rem;
  position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:1rem;}
.scard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc);}
.sicon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--ssoft);border:1px solid var(--sline);color:var(--sc);font-size:1.1rem;flex-shrink:0;}
.sinfo{flex:1;min-width:0;}
.slabel{font-size:.76rem;color:var(--muted);margin-bottom:.15rem;}
.sval{font-size:1.35rem;font-weight:700;color:var(--sc);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Tools & Buttons */
.tools{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;}
.search{position:relative;flex:1 1 300px;max-width:420px;}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:.88rem;outline:none;padding:.65rem 1rem .65rem 2.6rem;border-radius:10px;transition:border-color .25s;}
.search input:focus{border-color:var(--green);}
.search i{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:.85rem;}
.btns{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;
  padding:.52rem 1rem;border-radius:9px;font-size:.78rem;transition:all .25s;display:inline-flex;align-items:center;gap:.45rem;text-decoration:none;}
.btn:hover{border-color:var(--green);color:var(--green);}
.btn.primary{background:rgba(0,255,157,.12);border-color:var(--green);color:var(--green);font-weight:600;}
.btn.primary:hover{background:var(--green);color:#05140e;box-shadow:0 0 16px var(--glow);}
.btn.on{border-color:var(--green);color:var(--green);}
.btn.off{border-color:#3a2a2a;color:#ff8f8f;}

.status{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
  font-size:.76rem;color:var(--dim);margin-bottom:1.5rem;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:.45rem;}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.bad{background:#ff6b6b;box-shadow:0 0 8px #ff6b6b;}

/* Group & Table */
.group{margin-bottom:2rem;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:var(--panel);box-shadow:0 6px 26px rgba(0,0,0,.45);}
.ghead{display:flex;align-items:center;gap:.75rem;padding:1rem 1.25rem;
  border-left:4px solid var(--gc);background:linear-gradient(90deg,var(--gsoft),transparent 60%);
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.gicon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:var(--gsoft);border:1px solid var(--gline);color:var(--gc);font-size:.9rem;}
.gname{font-size:1.02rem;font-weight:600;color:var(--gc);}
.gmeta{margin-left:auto;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.gcount{font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.05);
  padding:.22rem .7rem;border-radius:999px;}

.table-wrap{width:100%;overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{font-size:.72rem;font-weight:500;color:var(--dim);text-align:left;letter-spacing:.4px;
  padding:.7rem 1rem;border-bottom:1px solid var(--line);background:#0a100f;white-space:nowrap;}
thead th.num, tbody td.num{text-align:right;}
tbody td{padding:.85rem 1rem;border-bottom:1px solid #121b19;vertical-align:middle;font-size:.86rem;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .25s;}
tbody tr:hover{background:#121a18;}
tbody tr.future-row{opacity:.62;background:rgba(255,255,255,.01);}
tbody tr.sim-row{background:rgba(0,255,157,.04);}

.c-no{width:52px;color:var(--dim);font-size:.78rem;font-weight:600;letter-spacing:1px;}
.c-date{font-weight:600;color:var(--text);white-space:nowrap;}
.c-note{color:var(--muted);font-size:.82rem;max-width:340px;}
.c-act{text-align:right;white-space:nowrap;}

.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.76rem;font-weight:600;
  padding:.25rem .72rem;border-radius:999px;white-space:nowrap;
  background:var(--cs);border:1px solid var(--cl);color:var(--cc);}

.go{display:inline-flex;align-items:center;gap:.4rem;background:var(--green);color:#06120d;
  text-decoration:none;font-size:.75rem;font-weight:600;padding:.4rem .88rem;border-radius:999px;
  transition:box-shadow .25s,filter .25s;border:none;cursor:pointer;}
.go:hover{filter:brightness(1.08);box-shadow:0 0 16px var(--glow);}
.go.sec{background:rgba(56,189,248,.14);color:var(--blue);border:1px solid rgba(56,189,248,.4);}
.go.sec:hover{background:var(--blue);color:#04131a;box-shadow:0 0 14px rgba(56,189,248,.3);}

/* State & Loading */
.state{text-align:center;padding:3.5rem 1rem;color:var(--muted);line-height:1.8;}
.spin{width:40px;height:40px;margin:0 auto 1rem;border-radius:50%;
  border:3px solid var(--line);border-top-color:var(--green);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.err{color:#ff6b6b;}
.log{margin:1.25rem auto 0;max-width:660px;text-align:left;background:#0a100f;border:1px solid var(--line);
  border-radius:10px;padding:1rem;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;
  color:#7d8f89;white-space:pre-wrap;word-break:break-all;}

/* Dialog / Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(3,7,6,.82);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;padding:1rem;z-index:999;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:520px;
  box-shadow:0 16px 50px rgba(0,0,0,.75);overflow:hidden;animation:pop .22s ease-out;}
@keyframes pop{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 1.35rem;
  border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(0,255,157,.1),transparent);}
.mtitle{font-size:1.05rem;font-weight:600;color:var(--green);display:flex;align-items:center;gap:.55rem;}
.mclose{background:none;border:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:.25rem;}
.mclose:hover{color:var(--text);}
.mbody{padding:1.35rem;}
.fg{margin-bottom:1rem;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;}
.flabel{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.4rem;}
.finput, .fselect{width:100%;background:#080d0c;border:1px solid var(--line);color:var(--text);
  padding:.62rem .85rem;border-radius:9px;font-size:.86rem;outline:none;transition:border-color .2s;}
.finput:focus, .fselect:focus{border-color:var(--green);}
.fhint{font-size:.72rem;color:var(--dim);margin-top:.35rem;}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:1rem 1.35rem;
  border-top:1px solid var(--line);background:#0a0f0e;flex-wrap:wrap;}

@media (max-width:820px){
  .hide-sm{display:none;}
  tbody td{padding:.75rem .7rem;}
  .fg-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo" id="logo"></div>
    <div class="badge"><i class="fa-solid fa-piggy-bank fx-t"></i><span class="fx">Saving &amp; Investment Directory</span></div>
  </header>

  <!-- Summary Cards -->
  <div class="summary-grid" id="summaryGrid"></div>

  <!-- Tools -->
  <div class="tools">
    <div class="search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="q" type="text" placeholder="ค้นหา วันที่ / ยอดเงิน / หมายเหตุ (เช่น FOREX, ทอง, ETF) / ปี ค.ศ.">
    </div>
    <div class="btns">
      <button class="btn primary" id="openModalBtn"><i class="fa-solid fa-calendar-plus"></i> กรอกข้อมูลอนาคต</button>
      <button class="btn" id="toggleFutureBtn"><i class="fa-solid fa-eye-slash"></i> แถวอนาคต: ซ่อน</button>
      <button class="btn on" id="motion"><i class="fa-solid fa-wand-magic-sparkles"></i> แอนิเมชัน: เปิด</button>
      <button class="btn" id="reload"><i class="fa-solid fa-rotate"></i> โหลดใหม่</button>
    </div>
  </div>

  <!-- Connection Status -->
  <div class="status">
    <span id="count"></span>
    <span><span class="dot" id="dot"></span><span id="srcText">กำลังเชื่อมต่อ...</span></span>
  </div>

  <!-- Output Table -->
  <div id="out">
    <div class="state"><div class="spin"></div>กำลังดึงข้อมูลจาก Google Sheet...</div>
  </div>

</div>

<!-- Dialog สำหรับเลือกวันที่และกรอกข้อมูลอนาคต -->
<div class="modal-backdrop" id="futureModal">
  <div class="modal">
    <div class="mhead">
      <div class="mtitle"><i class="fa-solid fa-calendar-check"></i> บันทึก / จำลองข้อมูลวันที่ในอนาคต</div>
      <button class="mclose" id="closeModalBtn" title="ปิด"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="futureForm">
      <div class="mbody">
        <div class="fg-row">
          <div class="fg">
            <label class="flabel">เลือกงวดวันที่ในอนาคต (จาก Sheet)</label>
            <select class="fselect" id="fPresetDate">
              <option value="">-- กำหนดวันที่เอง --</option>
            </select>
          </div>
          <div class="fg">
            <label class="flabel">วันที่ (ว/ด/ป หรือ เลือกจากปฏิทิน)</label>
            <input type="date" class="finput" id="fDate" required>
          </div>
        </div>

        <div class="fg-row">
          <div class="fg">
            <label class="flabel">รวมฝาก (+)</label>
            <input type="number" step="any" class="finput" id="fDeposit" placeholder="เช่น 5000" value="5000">
          </div>
          <div class="fg">
            <label class="flabel">ลงทุน (- หรือ +)</label>
            <input type="number" step="any" class="finput" id="fInvest" placeholder="เช่น -2500" value="0">
          </div>
        </div>

        <div class="fg-row">
          <div class="fg">
            <label class="flabel">อื่นๆ (- หรือ +)</label>
            <input type="number" step="any" class="finput" id="fOther" placeholder="เช่น 0" value="0">
          </div>
          <div class="fg">
            <label class="flabel">คงเหลือคำนวณอัตโนมัติ</label>
            <input type="text" class="finput" id="fRemainPreview" readonly style="color:var(--green);font-weight:600;">
          </div>
        </div>

        <div class="fg">
          <label class="flabel">หมายเหตุ / รายละเอียดเพิ่มเติม</label>
          <input type="text" class="finput" id="fNote" placeholder="เช่น ฝากประจำเดือน, ซื้อทอง, ลงทุน ETF">
        </div>

        <div class="fg" style="margin-bottom:0;">
          <label class="flabel">ลิงก์รูปสลิป / หลักฐาน (ถ้ามี)</label>
          <input type="url" class="finput" id="fUrl" placeholder="https://drive.google.com/...">
          <div class="fhint">* เมื่อกดบันทึก ระบบจะเพิ่ม/อัปเดตรายการแสดงผลในตารางทันที และสามารถกดเปิด Google Sheet เพื่อวางข้อมูลจริงได้</div>
        </div>
      </div>
      <div class="mfoot">
        <a class="btn" id="openSheetLink" href="#" target="_blank" rel="noopener">
          <i class="fa-solid fa-table"></i> เปิด Google Sheet จริง
        </a>
        <div style="display:flex;gap:.5rem;">
          <button type="button" class="btn" id="clearSimBtn" style="display:none;color:var(--red);">ล้างค่าจำลอง</button>
          <button type="submit" class="go"><i class="fa-solid fa-check"></i> บันทึกรายการ</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  /* ===================== CONFIG ===================== */
  var SHEET_ID = "1JtfBTpFaXKytKb4KLzM0yjOxNnvLyLadtWOGC0ZLGD8";
  var GID      = "1089784557";
  var TAB      = "Saving";

  var DATA = [], SIM_DATA = [], FUTURE_SLOTS = [], SUMMARY = null;
  var LINK_MAP = {};
  var LOG = [], ANIMS = [], MOTION = true, SHOW_FUTURE = false;

  document.getElementById("openSheetLink").href =
    "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit?gid=" + GID + "#gid=" + GID;

  /* ===================== MOTION ENGINE (Web Animations API) ===================== */
  var PRESET = {
    "fx":   { amp:7,  dur:2600, rot:0   },
    "fx-b": { amp:11, dur:3000, rot:0   },
    "fx-t": { amp:9,  dur:3400, rot:2.2 }
  };

  function animateAll(root){
    var nodes = (root || document).querySelectorAll(".fx,.fx-b,.fx-t");
    var i, el, key, p, step, anim;
    for(i = 0; i < nodes.length; i++){
      el = nodes[i];
      if(el.__anim) continue;
      key = el.classList.contains("fx-b") ? "fx-b" : (el.classList.contains("fx-t") ? "fx-t" : "fx");
      p = PRESET[key];
      step = (i % 14) * 190;
      try{
        anim = el.animate(
          [
            { transform:"translateY(0px) rotate(0deg)" },
            { transform:"translateY(-" + p.amp + "px) rotate(" + (-p.rot) + "deg)" },
            { transform:"translateY(0px) rotate(0deg)" }
          ],
          { duration:p.dur, delay:-step, iterations:Infinity, easing:"ease-in-out" }
        );
        el.__anim = anim;
        ANIMS.push(anim);
        if(!MOTION) anim.pause();
      }catch(e){}
    }
  }

  function clearAnims(){
    for(var i = 0; i < ANIMS.length; i++){ try{ ANIMS[i].cancel(); }catch(e){} }
    ANIMS = [];
  }

  function setMotion(on){
    MOTION = on;
    for(var i = 0; i < ANIMS.length; i++){
      try{ on ? ANIMS[i].play() : ANIMS[i].pause(); }catch(e){}
    }
    var b = document.getElementById("motion");
    b.className = "btn " + (on ? "on" : "off");
    b.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> แอนิเมชัน: ' + (on ? "เปิด" : "ปิด");
  }

  /* ===================== COLOR SYSTEM ===================== */
  var CAT_COLORS = ["#00ff9d","#38bdf8","#a78bfa","#22d3ee","#4ade80","#fbbf24","#f472b6","#60a5fa"];
  function hash(s){ var h=0,i; s=String(s); for(i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
  function pick(list,key){ return list[hash(key)%list.length]; }
  function soft(hex,a){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return "rgba("+r+","+g+","+b+","+a+")";
  }

  /* ===================== UTIL ===================== */
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(m){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
    });
  }
  function parseNum(v){
    if(v == null || v === "") return null;
    if(typeof v === "number") return v;
    var clean = String(v).replace(/,/g, "").trim();
    if(clean === "" || clean === "-") return null;
    var n = Number(clean);
    return isNaN(n) ? null : n;
  }
  function fmtNum(n, plusSign){
    if(n == null || isNaN(n)) return "-";
    var s = n.toLocaleString("en-US", { maximumFractionDigits: 2 });
    if(plusSign && n > 0) return "+" + s;
    return s;
  }
  function fixDate(v){
    var m = /^Date\((\d+),(\d+),(\d+)/.exec(String(v));
    if(!m) return String(v==null?"":v).trim();
    return Number(m[3]) + "/" + (Number(m[2])+1) + "/" + m[1];
  }
  function dmyToISO(dmy){
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(dmy).trim());
    if(!m) return "";
    var d = m[1].length < 2 ? "0"+m[1] : m[1];
    var mo = m[2].length < 2 ? "0"+m[2] : m[2];
    return m[3] + "-" + mo + "-" + d;
  }
  function isoToDMY(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso).trim());
    if(!m) return iso;
    return Number(m[3]) + "/" + Number(m[2]) + "/" + m[1];
  }
  function parseCSV(str){
    var rows=[],row=[],val="",q=false,i,c;
    str=str.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
    for(i=0;i<str.length;i++){
      c=str[i];
      if(q){
        if(c==='"'){ if(str[i+1]==='"'){ val+='"'; i++; } else q=false; } else val+=c;
      }else{
        if(c==='"') q=true;
        else if(c===","){ row.push(val); val=""; }
        else if(c==="\n"){ row.push(val); rows.push(row); row=[]; val=""; }
        else val+=c;
      }
    }
    row.push(val); rows.push(row);
    return rows.filter(function(r){ return r.some(function(x){ return String(x).trim()!==""; }); });
  }

  /* แยกข้อความหมายเหตุ และดึงลิงก์รูปภาพ */
  function extractLinksAndCleanNote(noteText, rowDate){
    var raw = String(noteText || "").trim();
    var links = [];

    // 1. ค้นหา URL ที่อยู่ในข้อความโดยตรง
    var urlRegex = /(https?:\/\/[^\s"'<>]+)/gi;
    var match;
    while((match = urlRegex.exec(raw)) !== null){
      links.push({ label: "เปิดลิงก์", url: match[1] });
    }

    // 2. ค้นหาชื่อไฟล์รูป เช่น 2025-06-01_M1M_Saving.jpg แล้วเทียบกับ LINK_MAP ที่ดึงจาก htmlview
    var fileRegex = /([\w\-]+\.(?:jpg|jpeg|png|pdf|webp))/gi;
    var fMatch;
    while((fMatch = fileRegex.exec(raw)) !== null){
      var fname = fMatch[1];
      var mappedUrl = LINK_MAP[fname] || LINK_MAP[raw] || LINK_MAP[rowDate] || "";
      links.push({
        label: fname,
        url: mappedUrl,
        isFile: true
      });
    }

    // หากทั้งช่องมีลิงก์ใน LINK_MAP แต่ไม่ได้ลงท้ายด้วย .jpg
    if(!links.length && LINK_MAP[raw]){
      links.push({ label: raw, url: LINK_MAP[raw] });
    }

    return { text: raw, links: links };
  }

  /* แปลงแถวจาก Sheet เป็นโครงสร้างข้อมูล */
  function processRows(rows){
    var sumRow = null;
    var list = [];
    FUTURE_SLOTS = [];

    for(var i = 0; i < rows.length; i++){
      var r = rows[i];
      var c0 = String(r[0]==null?"":r[0]).trim();
      var c1 = fixDate(r[1]);

      // ตรวจจับแถวที่ 1 (ยอดรวมสะสมด้านบนตาราง)
      if(!sumRow && c0 === "" && c1 === "" && (parseNum(r[2]) !== null || parseNum(r[3]) !== null)){
        sumRow = {
          deposit: parseNum(r[2]) || 0,
          invest:  parseNum(r[3]) || 0,
          other:   parseNum(r[4]) || 0,
          remain:  parseNum(r[5]) || 0
        };
        continue;
      }

      // ข้ามแถว Header
      if(/ลำดับ|วันที่/i.test(c0 + c1)) continue;

      // แถวข้อมูลต้องมีลำดับ หรือ วันที่
      if(!c0 && !c1) continue;

      var dep = parseNum(r[2]);
      var inv = parseNum(r[3]);
      var oth = parseNum(r[4]);
      var rem = parseNum(r[5]);
      var noteRaw = String(r[6]==null?"":r[6]).trim();
      var yr  = String(r[7]==null?"":r[7]).trim();

      if(!yr && /\d{4}$/.test(c1)){
        yr = c1.split("/").pop();
      }
      yr = yr || "ไม่ระบุปี";

      // ตรวจสอบว่าเป็นแถวอนาคตหรือไม่ (ยังไม่มีตัวเลขฝาก/ลงทุน/อื่นๆ/คงเหลือ และไม่มีหมายเหตุ)
      var isFuture = (dep === null && inv === null && oth === null && rem === null && noteRaw === "");

      var item = {
        no: c0 ? (c0.length < 2 ? "0" + c0 : c0) : String(list.length + 1),
        date: c1,
        deposit: dep,
        invest: inv,
        other: oth,
        remain: rem,
        note: noteRaw,
        year: yr,
        isFuture: isFuture,
        isSim: false
      };

      if(isFuture && c1){
        FUTURE_SLOTS.push(item);
      }
      list.push(item);
    }

    // หากแถวบนสุดไม่มีสูตรรวม ให้คำนวณสดจากแถวที่มีข้อมูล
    if(!sumRow){
      var sDep = 0, sInv = 0, sOth = 0;
      list.forEach(function(x){
        if(!x.isFuture){
          sDep += (x.deposit || 0);
          sInv += (x.invest || 0);
          sOth += (x.other || 0);
        }
      });
      sumRow = { deposit: sDep, invest: sInv, other: sOth, remain: sDep + sInv + sOth };
    }

    SUMMARY = sumRow;
    populateFuturePreset();
    return list;
  }

  /* ===================== LOADERS ===================== */
  // ดึงลิงก์ Hyperlink จากหน้า htmlview ของ Google Sheet เพื่อให้คลิกเปิดรูปภาพสลิปได้จริง
  async function loadSheetHyperlinks(){
    try{
      var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/htmlview?gid=" + GID + "&_=" + Date.now();
      var res = await fetch(url);
      if(!res.ok) return;
      var html = await res.text();
      var doc = new DOMParser().parseFromString(html, "text/html");
      var anchors = doc.querySelectorAll("a[href]");
      anchors.forEach(function(a){
        var txt = (a.textContent || "").trim();
        var href = a.getAttribute("href") || "";
        // แปลง Google Redirect URL ให้เป็นลิงก์ตรง
        var m = /[?&]q=([^&]+)/.exec(href);
        if(m) href = decodeURIComponent(m[1]);
        if(txt && /^https?:\/\//i.test(href)){
          LINK_MAP[txt] = href;
        }
      });
    }catch(e){}
  }

  function loadJSONP(){
    return new Promise(function(resolve,reject){
      var cb="gvizCb_"+Date.now(), done=false, s=document.createElement("script");
      var timer=setTimeout(function(){
        if(done) return; done=true; cleanup();
        reject(new Error("หมดเวลารอ 12 วินาที"));
      },12000);
      function cleanup(){
        clearTimeout(timer);
        try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
        if(s.parentNode) s.parentNode.removeChild(s);
      }
      window[cb]=function(json){
        if(done) return; done=true; cleanup();
        try{
          if(!json||!json.table) throw new Error("โครงสร้างข้อมูลไม่ถูกต้อง");
          var rows = [];
          // ดึงข้อมูลจาก cols label เผื่อ Google Visualization ยุบแถวแรกไปไว้ใน label
          var colLabels = (json.table.cols||[]).map(function(c){ return c ? (c.label || "") : ""; });
          if(colLabels.some(function(l){ return /\d/.test(l); })){
            rows.push(colLabels);
          }
          (json.table.rows||[]).forEach(function(r){
            rows.push((r.c||[]).map(function(c){
              if(!c) return "";
              if(c.f!=null && c.f!=="") return c.f;
              return fixDate(c.v);
            }));
          });
          resolve(rows);
        }catch(e){ reject(e); }
      };
      s.src="https://docs.google.com/spreadsheets/d/"+SHEET_ID+
            "/gviz/tq?tqx=out:json;responseHandler:"+cb+
            "&gid="+GID+"&headers=0&_="+Date.now();
      s.onerror=function(){ if(done) return; done=true; cleanup(); reject(new Error("โหลด script ไม่สำเร็จ")); };
      document.head.appendChild(s);
    });
  }

  var FALLBACK=[
    { label:"gviz CSV (GID)", url:"https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:csv&gid="+GID },
    { label:"Export CSV", url:"https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/export?format=csv&gid="+GID }
  ];

  async function loadFetchCSV(src){
    var res = await fetch(src.url + "&_=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    var t = await res.text();
    if(/<html|accounts\.google\.com/i.test(t.slice(0,400))) throw new Error("ถูก redirect ไปหน้า login");
    return parseCSV(t);
  }

  async function load(){
    LOG=[];
    setStatus("กำลังเชื่อมต่อ...","");
    document.getElementById("out").innerHTML=
      '<div class="state"><div class="spin"></div>กำลังดึงข้อมูลจาก Google Sheet...</div>';

    // ดึง Hyperlink รูปภาพควบคู่กันไป
    loadSheetHyperlinks().then(function(){
      if(DATA.length) renderAll();
    });

    try{
      var raw1 = await loadJSONP();
      var d1 = processRows(raw1);
      if(!d1.length) throw new Error("อ่านได้ 0 แถว");
      LOG.push("OK   JSONP (gviz) → " + d1.length + " แถว");
      return success(d1, "JSONP (gviz)");
    }catch(e){ LOG.push("FAIL JSONP (gviz) → " + e.message); }

    for(var i=0;i<FALLBACK.length;i++){
      try{
        var raw2 = await loadFetchCSV(FALLBACK[i]);
        var d2 = processRows(raw2);
        if(!d2.length) throw new Error("อ่านได้ 0 แถว");
        LOG.push("OK   " + FALLBACK[i].label + " → " + d2.length + " แถว");
        return success(d2, FALLBACK[i].label);
      }catch(e2){ LOG.push("FAIL " + FALLBACK[i].label + " → " + e2.message); }
    }
    fail();
  }

  function success(d,label){
    DATA = d;
    setStatus("เชื่อมต่อผ่าน " + label, "ok");
    renderAll();
  }
  function setStatus(t,c){
    document.getElementById("srcText").textContent = t;
    document.getElementById("dot").className = "dot " + c;
  }
  function fail(){
    setStatus("เชื่อมต่อไม่สำเร็จ","bad");
    document.getElementById("count").textContent="";
    document.getElementById("out").innerHTML=
      '<div class="state err"><i class="fa-solid fa-triangle-exclamation" style="font-size:1.8rem"></i><br><br>'+
      'ดึงข้อมูลไม่สำเร็จทุกช่องทาง (กรุณาตรวจสอบว่าเปิดสิทธิ์ Google Sheet เป็น "ทุกคนที่มีลิงก์ดูได้")<div class="log">'+esc(LOG.join("\n"))+'</div></div>';
  }

  /* ===================== COMBINED DATA & RENDER ===================== */
  function getMergedData(){
    var list = DATA.map(function(x){ return Object.assign({}, x); });
    // นำข้อมูลที่ผู้ใช้กรอกจำลองวันในอนาคตมาผสาน
    SIM_DATA.forEach(function(sim){
      var idx = list.findIndex(function(item){ return item.date === sim.date; });
      if(idx > -1){
        list[idx] = Object.assign({}, list[idx], sim, { isFuture: false, isSim: true });
      }else{
        list.push(Object.assign({}, sim, { no: String(list.length + 1), isFuture: false, isSim: true }));
      }
    });
    return list;
  }

  function renderSummary(merged){
    var dep = 0, inv = 0, oth = 0;
    merged.forEach(function(x){
      if(!x.isFuture){
        dep += (x.deposit || 0);
        inv += (x.invest || 0);
        oth += (x.other || 0);
      }
    });
    var rem = dep + inv + oth;

    // หากไม่มี SIM_DATA และมี SUMMARY จากแถวที่ 1 ของ Sheet ให้ใช้ค่าจาก Sheet
    if(SIM_DATA.length === 0 && SUMMARY){
      dep = SUMMARY.deposit;
      inv = SUMMARY.invest;
      oth = SUMMARY.other;
      rem = SUMMARY.remain;
    }

    var cards = [
      { label:"รวมฝากสะสม", val:fmtNum(dep), color:"#00ff9d", icon:"fa-solid fa-sack-dollar" },
      { label:"ลงทุนสะสม",  val:fmtNum(inv), color:"#38bdf8", icon:"fa-solid fa-chart-line" },
      { label:"อื่นๆ สะสม",  val:fmtNum(oth), color:"#fb7185", icon:"fa-solid fa-sliders" },
      { label:"คงเหลือสุทธิ", val:fmtNum(rem), color:"#fbbf24", icon:"fa-solid fa-wallet" }
    ];

    document.getElementById("summaryGrid").innerHTML = cards.map(function(c){
      return '<div class="scard" style="--sc:'+c.color+';--ssoft:'+soft(c.color,.12)+';--sline:'+soft(c.color,.35)+'">'+
        '<div class="sicon fx-t"><i class="'+c.icon+'"></i></div>'+
        '<div class="sinfo">'+
          '<div class="slabel fx">'+esc(c.label)+'</div>'+
          '<div class="sval fx-b">'+esc(c.val)+'</div>'+
        '</div>'+
      '</div>';
    }).join("");
  }

  function renderAll(){
    var merged = getMergedData();
    renderSummary(merged);

    var q = document.getElementById("q").value.toLowerCase().trim();
    var filtered = merged.filter(function(x){
      if(!SHOW_FUTURE && x.isFuture) return false;
      if(!q) return true;
      var hay = (x.no + " " + x.date + " " + (x.deposit||"") + " " + (x.invest||"") + " " + (x.other||"") + " " + x.note + " " + x.year).toLowerCase();
      return hay.indexOf(q) > -1;
    });

    renderTable(filtered, merged.filter(function(x){ return !x.isFuture; }).length, merged.length);
  }

  function renderTable(list, activeCount, totalCount){
    var out = document.getElementById("out");
    document.getElementById("count").textContent =
      "แสดงข้อมูลถึงปัจจุบัน " + list.length + " รายการ (บันทึกแล้ว " + activeCount + " / ทั้งหมด " + totalCount + " งวด)";
    clearAnims();

    if(!list.length){
      out.innerHTML = '<div class="state">ไม่พบรายการที่ตรงกับเงื่อนไข</div>';
      animateAll(document);
      return;
    }

    var order = [], bucket = {};
    list.forEach(function(x){
      if(!bucket[x.year]){ bucket[x.year] = []; order.push(x.year); }
      bucket[x.year].push(x);
    });

    out.innerHTML = order.map(function(yr){
      var cc = pick(CAT_COLORS, yr);
      var rowsInYear = bucket[yr];
      var yDep = 0, yInv = 0, yOth = 0;
      rowsInYear.forEach(function(x){
        yDep += (x.deposit || 0);
        yInv += (x.invest || 0);
        yOth += (x.other || 0);
      });

      var head = '<div class="ghead" style="--gc:'+cc+';--gsoft:'+soft(cc,.10)+';--gline:'+soft(cc,.35)+'">'+
          '<div class="gicon fx-t"><i class="fa-regular fa-calendar-days"></i></div>'+
          '<div class="gname fx-b">ปี ค.ศ. '+esc(yr)+'</div>'+
          '<div class="gmeta">'+
            '<span class="gcount fx">ฝากรวม: <strong style="color:var(--green)">'+fmtNum(yDep)+'</strong></span>'+
            '<span class="gcount fx">ลงทุน: <strong style="color:var(--blue)">'+fmtNum(yInv)+'</strong></span>'+
            '<span class="gcount fx">'+rowsInYear.length+' งวด</span>'+
          '</div>'+
        '</div>';

      var thead = '<thead><tr>'+
          '<th><span class="fx">#</span></th>'+
          '<th><span class="fx">วันที่</span></th>'+
          '<th class="num"><span class="fx">รวมฝาก</span></th>'+
          '<th class="num"><span class="fx">ลงทุน</span></th>'+
          '<th class="num hide-sm"><span class="fx">อื่นๆ</span></th>'+
          '<th class="num"><span class="fx">คงเหลือ</span></th>'+
          '<th><span class="fx">หมายเหตุ</span></th>'+
          '<th class="c-act"><span class="fx">หลักฐาน / จัดการ</span></th>'+
        '</tr></thead>';

      var rows = rowsInYear.map(function(x){
        var parsedNote = extractLinksAndCleanNote(x.note, x.date);

        // สีของ Chip ตัวเลข
        var depHtml = x.deposit != null
          ? '<span class="chip fx-t" style="--cc:#00ff9d;--cs:'+soft("#00ff9d",.10)+';--cl:'+soft("#00ff9d",.35)+'"><i class="fa-solid fa-arrow-trend-up"></i>'+fmtNum(x.deposit)+'</span>'
          : '<span style="color:var(--dim)">-</span>';

        var invColor = x.invest < 0 ? "#38bdf8" : (x.invest > 0 ? "#4ade80" : "#8fa39c");
        var invHtml = x.invest != null && x.invest !== 0
          ? '<span class="chip fx-t" style="--cc:'+invColor+';--cs:'+soft(invColor,.10)+';--cl:'+soft(invColor,.35)+'">'+fmtNum(x.invest)+'</span>'
          : (x.invest === 0 ? '<span style="color:var(--dim)">0</span>' : '<span style="color:var(--dim)">-</span>');

        var othColor = x.other < 0 ? "#fb7185" : "#a78bfa";
        var othHtml = x.other != null && x.other !== 0
          ? '<span class="chip fx-t" style="--cc:'+othColor+';--cs:'+soft(othColor,.10)+';--cl:'+soft(othColor,.35)+'">'+fmtNum(x.other)+'</span>'
          : (x.other === 0 ? '<span style="color:var(--dim)">0</span>' : '<span style="color:var(--dim)">-</span>');

        var remColor = (x.remain || 0) > 0 ? "#fbbf24" : ((x.remain || 0) < 0 ? "#fb7185" : "var(--text)");
        var remHtml = x.remain != null
          ? '<span class="fx-b" style="font-weight:700;color:'+remColor+'">'+fmtNum(x.remain)+'</span>'
          : '<span style="color:var(--dim)">-</span>';

        // ปุ่ม Action ด้านขวาสุด
        var actHtml = "";
        if(x.isFuture){
          actHtml = '<button type="button" class="go sec fx-b quick-fill-btn" data-date="'+esc(x.date)+'">'+
            '<i class="fa-solid fa-pen-to-square"></i> กรอกข้อมูล</button>';
        } else if(parsedNote.links.length > 0){
          var firstLink = parsedNote.links[0];
          var targetHref = firstLink.url || ("https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit?gid=" + GID + "#gid=" + GID);
          var btnTitle = firstLink.url ? "เปิดดูรูปภาพ: " + firstLink.label : "เปิดดูรูปจากใน Sheet (" + firstLink.label + ")";
          actHtml = '<a class="go fx-b" href="'+esc(targetHref)+'" target="_blank" rel="noopener" title="'+esc(btnTitle)+'">'+
            '<i class="fa-regular fa-image"></i> ดูรูปสลิป</a>';
        } else if(x.isSim){
          actHtml = '<span class="chip" style="--cc:#fbbf24;--cs:rgba(251,191,36,.12);--cl:rgba(251,191,36,.4)">บันทึกจำลอง</span>';
        } else {
          actHtml = '<span style="color:var(--dim);font-size:.75rem;"><i class="fa-solid fa-circle-check" style="color:var(--green)"></i> บันทึกแล้ว</span>';
        }

        var trClass = x.isFuture ? "future-row" : (x.isSim ? "sim-row" : "");

        return '<tr class="'+trClass+'">'+
          '<td class="c-no"><span class="fx">'+esc(x.no)+'</span></td>'+
          '<td class="c-date"><span class="fx-b">'+esc(x.date)+'</span></td>'+
          '<td class="num">'+depHtml+'</td>'+
          '<td class="num">'+invHtml+'</td>'+
          '<td class="num hide-sm">'+othHtml+'</td>'+
          '<td class="num">'+remHtml+'</td>'+
          '<td class="c-note"><span class="fx">'+(parsedNote.text ? esc(parsedNote.text) : '<span style="color:var(--dim)">-</span>')+'</span></td>'+
          '<td class="c-act">'+actHtml+'</td>'+
        '</tr>';
      }).join("");

      return '<div class="group">'+head+'<div class="table-wrap"><table>'+thead+'<tbody>'+rows+'</tbody></table></div></div>';
    }).join("");

    // ผูก Event ปุ่มกรอกข้อมูลด่วนในแถวอนาคต
    var qBtns = out.querySelectorAll(".quick-fill-btn");
    for(var i = 0; i < qBtns.length; i++){
      qBtns[i].addEventListener("click", function(){
        openFutureModal(this.getAttribute("data-date"));
      });
    }

    animateAll(document);
  }

  /* ===================== FUTURE DATE DIALOG ===================== */
  var modal = document.getElementById("futureModal");
  var fPreset = document.getElementById("fPresetDate");
  var fDate = document.getElementById("fDate");
  var fDeposit = document.getElementById("fDeposit");
  var fInvest = document.getElementById("fInvest");
  var fOther = document.getElementById("fOther");
  var fRemainPreview = document.getElementById("fRemainPreview");
  var fNote = document.getElementById("fNote");
  var fUrl = document.getElementById("fUrl");

  function populateFuturePreset(){
    var html = '<option value="">-- เลือกงวดวันที่อนาคตจาก Sheet หรือกำหนดเอง --</option>';
    FUTURE_SLOTS.forEach(function(s){
      html += '<option value="'+esc(s.date)+'">งวดที่ '+esc(s.no)+' — '+esc(s.date)+' (ปี '+esc(s.year)+')</option>';
    });
    fPreset.innerHTML = html;
  }

  function updateRemainPreview(){
    var d = parseNum(fDeposit.value) || 0;
    var i = parseNum(fInvest.value) || 0;
    var o = parseNum(fOther.value) || 0;
    fRemainPreview.value = fmtNum(d + i + o);
  }

  function openFutureModal(presetDMY){
    if(presetDMY){
      fPreset.value = presetDMY;
      fDate.value = dmyToISO(presetDMY);
    } else if(FUTURE_SLOTS.length > 0 && !fDate.value){
      fPreset.value = FUTURE_SLOTS[0].date;
      fDate.value = dmyToISO(FUTURE_SLOTS[0].date);
    } else if(!fDate.value){
      fDate.value = new Date().toISOString().slice(0,10);
    }
    updateRemainPreview();
    modal.classList.add("show");
  }

  function closeFutureModal(){
    modal.classList.remove("show");
  }

  fPreset.addEventListener("change", function(){
    if(this.value){
      fDate.value = dmyToISO(this.value);
    }
  });

  [fDeposit, fInvest, fOther].forEach(function(inp){
    inp.addEventListener("input", updateRemainPreview);
  });

  document.getElementById("openModalBtn").addEventListener("click", function(){
    openFutureModal("");
  });
  document.getElementById("closeModalBtn").addEventListener("click", closeFutureModal);
  modal.addEventListener("click", function(e){
    if(e.target === modal) closeFutureModal();
  });

  document.getElementById("futureForm").addEventListener("submit", function(e){
    e.preventDefault();
    var dmy = isoToDMY(fDate.value);
    var dep = parseNum(fDeposit.value) || 0;
    var inv = parseNum(fInvest.value) || 0;
    var oth = parseNum(fOther.value) || 0;
    var rem = dep + inv + oth;
    var noteStr = fNote.value.trim();
    var urlStr = fUrl.value.trim();

    if(urlStr){
      noteStr = (noteStr ? noteStr + " " : "") + urlStr;
    }

    var yr = dmy.split("/").pop() || new Date().getFullYear().toString();

    var existingIdx = SIM_DATA.findIndex(function(s){ return s.date === dmy; });
    var entry = {
      date: dmy,
      deposit: dep,
      invest: inv,
      other: oth,
      remain: rem,
      note: noteStr || "บันทึกข้อมูลล่วงหน้า",
      year: yr
    };

    if(existingIdx > -1) SIM_DATA[existingIdx] = entry;
    else SIM_DATA.push(entry);

    document.getElementById("clearSimBtn").style.display = "inline-flex";
    closeFutureModal();
    renderAll();
  });

  document.getElementById("clearSimBtn").addEventListener("click", function(){
    SIM_DATA = [];
    this.style.display = "none";
    closeFutureModal();
    renderAll();
  });

  /* ===================== LOGO & EVENTS ===================== */
  (function(){
    var t = "M1MSaving", html = "", i;
    for(i = 0; i < t.length; i++){
      html += '<span class="fx-b"' + (i >= 3 ? ' style="color:#00ff9d"' : '') + '>' + t[i] + '</span>';
    }
    document.getElementById("logo").innerHTML = html;
  })();

  document.getElementById("q").addEventListener("input", renderAll);
  document.getElementById("reload").addEventListener("click", load);
  document.getElementById("motion").addEventListener("click", function(){ setMotion(!MOTION); });

  document.getElementById("toggleFutureBtn").addEventListener("click", function(){
    SHOW_FUTURE = !SHOW_FUTURE;
    this.className = "btn " + (SHOW_FUTURE ? "on" : "");
    this.innerHTML = SHOW_FUTURE
      ? '<i class="fa-solid fa-eye"></i> แถวอนาคต: แสดง'
      : '<i class="fa-solid fa-eye-slash"></i> แถวอนาคต: ซ่อน';
    renderAll();
  });

  animateAll(document);
  setMotion(true);
  load();
})();
</script>
